
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- THANH DIEU HUONG NAVBAR -->
    <header>
        <nav>
            <!-- Logo -->
            <div class="logo">
                <a href="index.html">Bookstore Hub</a>
            </div>

            <!-- Menu chinh -->
            <ul class="menu">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="#danh-muc">Danh mục sách</a></li>
                <li><a href="#ban-chay">Sách bán chạy</a></li>
                <li><a href="#gioi-thieu">Giới thiệu</a></li>
                <li><a href="#lien-he">Liên hệ</a></li>
            </ul>

            <!-- O tim kiem -->
            <div class="search-box">
                <form action="#" method="get">
                    <input
                        type="text"
                        name="keyword"
                        placeholder="Tìm tên sách, tác giả, thể loại..."
                    >
                    <button type="submit">Tìm kiếm</button>
                </form>
            </div>

            <!-- Gio hang -->
            <div class="cart">
                <a href="#gio-hang">
                    🛒 Giỏ hàng
                    <span class="cart-count">0</span>
                </a>
            </div>

            <!-- Dang nhap / Dang ky -->
            <div class="account">
                <a href="#dang-nhap">Đăng nhập</a>
                <a href="#dang-ky">Đăng ký</a>
            </div>
        </nav>
    </header>

</body>
</html>
